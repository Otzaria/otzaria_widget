name: Apple (OtzariaKit)

on:
  pull_request:
    paths:
      - "apple/**"
      - ".github/workflows/apple.yml"
  push:
    branches-ignore: [master]
    paths:
      - "apple/**"
      - ".github/workflows/apple.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apple/OtzariaKit
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 16+
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          swift --version

      - uses: actions/cache@v4
        with:
          path: apple/OtzariaKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apple/OtzariaKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  xcode-apps:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: OtzariaWidgetMac
            destination: platform=macOS
            products: Release
          - scheme: OtzariaWidgetiOS
            destination: generic/platform=iOS Simulator
            products: Release-iphonesimulator
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 16+
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build ${{ matrix.scheme }} (unsigned)
        run: |
          xcodebuild -project apple/App/OtzariaWidget.xcodeproj -scheme "${{ matrix.scheme }}" -configuration Release \
            -destination "${{ matrix.destination }}" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build

      # LGPL: KosherSwift must stay in its own framework, never inside our binaries.
      - name: Check KosherSwift linking
        run: |
          app="build/dd/Build/Products/${{ matrix.products }}/OtzariaWidget.app"
          test "$(find "$app" -maxdepth 3 -type d -name 'KosherSwift*.framework' | wc -l)" -eq 1
          bad=0
          while IFS= read -r -d '' f; do
            case "$(file -b "$f")" in *Mach-O*) ;; *) continue ;; esac
            n=$(nm -U "$f" | awk '$2 ~ /^[Tt]$/ {print $3}' | xcrun swift-demangle \
              | grep -cE '^(static |merged )*(\(extension in KosherSwift\)|KosherSwift\.)' || true)
            echo "$n ${f#$app/}"
            [ "$n" -eq 0 ] || bad=1
          done < <(find "$app" -type f -not -path '*/KosherSwift*.framework/*' -print0)
          exit $bad
