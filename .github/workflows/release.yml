name: Build & Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OtzariaWidget.sln

      - name: Run tests
        run: dotnet test OtzariaWidget.sln -c Release --no-restore --logger "console;verbosity=minimal"

      - name: Generate version
        id: version
        shell: pwsh
        run: |
          $d = (Get-Date).ToString('yyyy.MMdd.HHmm', [cultureinfo]::InvariantCulture)
          $sha = "${{ github.sha }}".Substring(0, 7)
          $tag = "v$d"
          "version=$d"   >> $env:GITHUB_OUTPUT
          "tag=$tag"     >> $env:GITHUB_OUTPUT
          "sha=$sha"     >> $env:GITHUB_OUTPUT

      - name: Publish app
        run: >
          dotnet publish src/OtzariaWidget.App/OtzariaWidget.App.csproj
          -c Release -r win-x64 -o artifacts/layout --nologo

      - name: Copy packaging assets into layout
        shell: pwsh
        run: |
          $layout = 'artifacts/layout'
          foreach ($d in 'Assets', 'ProviderAssets') {
            $dst = Join-Path $layout $d
            if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
            Copy-Item "packaging/$d" $dst -Recurse
          }
          $tplDst = Join-Path $layout 'Templates'
          New-Item -ItemType Directory -Force $tplDst | Out-Null
          Copy-Item 'src/OtzariaWidget.App/Templates/*.json' $tplDst -Force
          Copy-Item 'THIRD-PARTY-NOTICES.md' (Join-Path $layout 'THIRD-PARTY-NOTICES.md') -Force

      - name: Write AppxManifest
        shell: pwsh
        run: |
          $parts = '${{ steps.version.outputs.version }}'.Split('.')
          $appxVer = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          $manifest = (Get-Content 'packaging/Package.appxmanifest' -Raw -Encoding UTF8)
          $manifest = $manifest.Replace('@VERSION@', $appxVer).Replace('@PUBLISHER@', 'CN=OtzariaDev').Replace('@IDENTITYNAME@', 'Otzaria.Widget').Replace('@PUBLISHERDISPLAYNAME@', 'Otzaria Dev')
          Set-Content 'artifacts/layout/AppxManifest.xml' $manifest -Encoding UTF8

      - name: Generate resources.pri (makepri)
        shell: pwsh
        run: |
          $kits = @(Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^10\.' } |
              Sort-Object { [version]$_.Name } -Descending |
              ForEach-Object { Join-Path $_.FullName 'x64' } |
              Where-Object { Test-Path (Join-Path $_ 'makepri.exe') })[0]
          if (-not $kits) { throw 'makepri.exe not found on the runner' }
          $layout = 'artifacts/layout'
          $cfg = 'artifacts/priconfig.xml'
          & "$kits/makepri.exe" createconfig /cf $cfg /dq en-US /pv 10.0.0 /o | Out-Null
          (Get-Content $cfg -Raw) -replace '<autoResourcePackage[^>]*/>', '' | Set-Content $cfg -Encoding UTF8
          & "$kits/makepri.exe" new /pr $layout /cf $cfg /mn "$layout/AppxManifest.xml" /of "$layout/resources.pri" /o | Out-Null

      - name: Clean layout
        shell: pwsh
        run: |
          $layout = 'artifacts/layout'
          Get-ChildItem $layout -Recurse -Include '*.pdb' -File | Remove-Item -Force
          Remove-Item "$layout/createdump.exe" -Force -ErrorAction SilentlyContinue
          Get-ChildItem $layout -Directory |
            Where-Object { $_.Name -match '^[a-z]{2,3}(-[A-Za-z]{2,4})?$' -and
              -not (Get-ChildItem $_.FullName -Recurse -File | Where-Object { $_.Name -notlike '*.resources.dll' }) } |
            Remove-Item -Recurse -Force

      - name: Create self-signed certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=OtzariaDev' `
            -KeyUsage DigitalSignature -FriendlyName 'Otzaria CI signing' `
            -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') `
            -NotAfter (Get-Date).AddYears(3)
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Export-Certificate -Cert $cert -FilePath artifacts/OtzariaDev.cer -Force | Out-Null
        id: cert

      - name: Build MSIX (makeappx + signtool)
        shell: pwsh
        run: |
          $kits = @(Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^10\.' } |
              Sort-Object { [version]$_.Name } -Descending |
              ForEach-Object { Join-Path $_.FullName 'x64' } |
              Where-Object { Test-Path (Join-Path $_ 'makeappx.exe') })[0]
          if (-not $kits) { throw 'makeappx.exe not found on the runner' }
          $version = '${{ steps.version.outputs.version }}'
          $msix = "artifacts/Otzaria.Widget_${version}_x64.msix"
          & "$kits/makeappx.exe" pack /d artifacts/layout /p $msix /o /nv | Out-Null
          if ($LASTEXITCODE) { throw 'makeappx failed' }
          & "$kits/signtool.exe" sign /fd SHA256 /sha1 ${{ steps.cert.outputs.thumbprint }} $msix | Out-Null
          if ($LASTEXITCODE) { throw 'signtool failed' }

      - name: Collect Windows App Runtime dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/dependencies | Out-Null
          $src = Get-ChildItem "$env:USERPROFILE/.nuget/packages/microsoft.windowsappsdk.runtime" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'tools/MSIX/win10-x64' } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($src) {
            Copy-Item "$src/*.msix" artifacts/dependencies/ -Force
            Write-Host "Copied runtime packages from $src"
          } else {
            Write-Warning 'Windows App Runtime MSIX packages not in NuGet cache; installer will skip dependency install'
          }

      - name: Build installer EXE (Inno Setup)
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $msixName = "Otzaria.Widget_${version}_x64.msix"
          $iscc = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          & $iscc packaging/installer.iss `
            "/DAppVersion=$version" `
            "/DMsixPath=$((Resolve-Path "artifacts/$msixName").Path)" `
            "/DMsixName=$msixName" `
            "/DCerPath=$((Resolve-Path 'artifacts/OtzariaDev.cer').Path)" `
            "/DDepsPath=$((Resolve-Path 'artifacts/dependencies').Path)" `
            "/DIconPath=$((Resolve-Path 'src/OtzariaWidget.App/Assets/app.ico').Path)" `
            "/DOutputDir=$((Resolve-Path 'artifacts').Path)"
          if ($LASTEXITCODE) { throw 'Inno Setup compilation failed' }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Otzaria Widget ${{ steps.version.outputs.version }} (${{ steps.version.outputs.sha }})"
          body: |
            Automated build from commit ${{ github.sha }}.

            **Install:** download and run the setup EXE (requires Administrator — it imports the signing certificate and installs the MSIX).
            After installation, open the Widgets board (`Win+W`) and click `+` to add Otzaria widgets.
          files: artifacts/OtzariaWidget-${{ steps.version.outputs.version }}-x64-setup.exe
          generate_release_notes: true

  # אפליקציית macOS עם הווידג'טים (DMG), מצורפת לאותה גרסה. חתימה ad-hoc (אין עדיין Developer ID), לכן זו גרסת תצוגה מקדימה.
  # כשל כאן אינו פוגע בגרסת Windows, שכבר פורסמה. iOS אינו מופץ: אין הפצה בלי חשבון מפתח של Apple.
  macos:
    needs: build
    runs-on: macos-15
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 16+
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build OtzariaWidgetMac (ad-hoc signed)
        run: |
          xcodebuild -project apple/App/OtzariaWidget.xcodeproj -scheme OtzariaWidgetMac -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$VERSION" build

      - name: Package DMG
        run: |
          stage=artifacts/OtzariaWidget
          mkdir -p "$stage"
          ditto build/dd/Build/Products/Release/OtzariaWidget.app "$stage/OtzariaWidget.app"
          cp THIRD-PARTY-NOTICES.md "$stage/"
          ln -s /Applications "$stage/Applications"
          codesign --verify --deep --strict "$stage/OtzariaWidget.app"
          hdiutil create -volname "Otzaria Widget" -srcfolder "$stage" -fs HFS+ -format UDZO -ov \
            "artifacts/OtzariaWidget-$VERSION-macOS.dmg"

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          gh release upload "$tag" "artifacts/OtzariaWidget-$VERSION-macOS.dmg" --clobber
          gh release view "$tag" --json body -q .body > notes.md
          cat >> notes.md <<NOTES

          **macOS (preview):** \`OtzariaWidget-$VERSION-macOS.dmg\` — macOS 14 or later. Ad-hoc signed and not notarized (no Apple Developer ID yet):
          open the DMG, drag \`OtzariaWidget.app\` onto Applications, then open it with right-click → Open (or System Settings → Privacy & Security → Open Anyway).
          The zmanim and Hebrew calendar widgets work on their own; the widgets that show Otzaria data may stay empty until the app is signed with a Developer ID. See \`apple/README.md\`.
          NOTES
          gh release edit "$tag" --notes-file notes.md

  # מגיש לחנות את אותה גרסה. לא פעיל עד שמוגדר המשתנה MSSTORE_PRODUCT_ID במאגר.
  store:
    needs: build
    if: vars.MSSTORE_PRODUCT_ID != ''
    runs-on: windows-latest
    concurrency:
      group: microsoft-store
      cancel-in-progress: false
    env:
      MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      SELLER_ID: ${{ secrets.SELLER_ID }}
    steps:
      # msstore publish מוחק הגשה שעדיין בבדיקה ופותח חדשה — בדחיפות תכופות הבדיקה לא הייתה מסתיימת.
      # לכן מדלגים כשיש הגשה בתהליך, וגם לפני הפרסום הראשון (שנעשה ב-Partner Center בלבד).
      - name: Check Store state
        id: state
        shell: pwsh
        run: |
          $token = (Invoke-RestMethod -Method Post "https://login.microsoftonline.com/$env:AZURE_AD_TENANT_ID/oauth2/token" -Body @{
            grant_type = 'client_credentials'; resource = 'https://manage.devcenter.microsoft.com'
            client_id = $env:AZURE_AD_APPLICATION_CLIENT_ID; client_secret = $env:AZURE_AD_APPLICATION_SECRET
          }).access_token
          $headers = @{ Authorization = "Bearer $token" }
          $api = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:MSSTORE_PRODUCT_ID"
          $app = Invoke-RestMethod $api -Headers $headers
          $publish = 'true'
          if (-not $app.lastPublishedApplicationSubmission) {
            Write-Host '::notice::The app has not been published yet; the first submission is done in Partner Center. Skipping.'
            $publish = 'false'
          } elseif ($app.pendingApplicationSubmission) {
            $pending = Invoke-RestMethod "$api/submissions/$($app.pendingApplicationSubmission.id)" -Headers $headers
            if ($pending.status -notin 'PendingCommit', 'CommitFailed', 'Canceled') {
              Write-Host "::notice::Submission $($pending.id) is in '$($pending.status)'; skipping so its certification is not restarted."
              $publish = 'false'
            }
          }
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/checkout@v7
        if: steps.state.outputs.publish == 'true'

      - name: Setup .NET 10
        if: steps.state.outputs.publish == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build Store MSIX
        if: steps.state.outputs.publish == 'true'
        shell: pwsh
        run: |
          $parts = '${{ needs.build.outputs.version }}'.Split('.')
          .\packaging\make-msix.ps1 -Store -Version "$($parts[0]).$($parts[1]).$($parts[2]).0" `
            -IdentityName 'F8854998.615306A22FAC3' -Publisher 'CN=B3B520D1-500C-4859-986C-448583CC927B' `
            -PublisherDisplayName 'אוצריא'
          $msix = @(Get-ChildItem artifacts\store\*.msix)
          if ($msix.Count -ne 1 -or $msix[0].Name -like '*PLACEHOLDER*') { throw 'Store MSIX was not produced correctly' }
          "MSIX=$($msix[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Microsoft Store CLI
        if: steps.state.outputs.publish == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Submit to Microsoft Store
        if: steps.state.outputs.publish == 'true'
        shell: pwsh
        run: |
          msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'msstore reconfigure failed' }
          msstore publish $env:MSIX -id $env:MSSTORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw 'msstore publish failed' }
